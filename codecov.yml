coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 70%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flags:
  # The files of the Rust report: comprs-core, as the Rust coverage step in
  # ci.yml leaves out the bindings and the benchmarks.
  rust:
    paths:
      - crates/core-lib/
    carryforward: true
  # The files that coverage.include in vitest.config.mts lists.
  javascript:
    paths:
      - streams.js
      - node.js
      - next/
    carryforward: true
