coverage:
  status:
    project:
      default:
        target: auto
        threshold: 5%
    patch:
      default:
        target: 70%

comment:
  layout: 'condensed_header, condensed_files, condensed_footer'
  require_changes: true

flags:
  rust:
    paths:
      - crates/
    carryforward: true
  # The files that coverage.include in vitest.config.mts lists.
  javascript:
    paths:
      - streams.js
      - node.js
    carryforward: true
