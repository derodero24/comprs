# Git clients may start hooks without the shell profile that puts rustup's
# cargo on PATH, so the cargo commands put ${CARGO_HOME:-~/.cargo}/bin first.
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    biome:
      run: pnpm exec biome check --staged --no-errors-on-unmatched --error-on-warnings
    rustfmt:
      run: PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" cargo fmt -- --check
      glob: "*.rs"

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm run check
    typecheck:
      run: pnpm run typecheck
    test:
      run: pnpm test
    clippy:
      run: PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" cargo clippy --workspace --all-targets -- -D warnings
    cargo-test:
      run: PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" cargo test
    cargo-deny:
      run: PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH" cargo deny check
