packages:
  - '.'
  - 'packages/*'
allowBuilds:
  esbuild: false
  lefthook: true
# Resolve only versions published at least 3 days (4320 minutes) ago, the
# same wait as minimumReleaseAge in renovate.json. Set explicitly, the cutoff
# is strict: pnpm asks before it installs a younger version, or fails when it
# cannot ask, instead of adding it to minimumReleaseAgeExclude on its own.
minimumReleaseAge: 4320
# Fail the install when a dependency's engines field excludes the running
# Node.js. pnpm 12 keeps only auth and registry keys from .npmrc, so the
# setting lives here.
engineStrict: true
