name: CodSpeed

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/codspeed.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - "rust-toolchain*"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

# A newer pull request push supersedes the running benchmarks. Pushes to
# main get a group per commit, so every main commit gets the baseline
# that later pull requests compare against.
concurrency:
  group: codspeed-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  rust-benchmarks:
    name: Rust Benchmarks
    # Pinned rather than ubuntu-latest. Simulation mode counts instructions
    # inside libc as well, so main baselines and pull requests must run on
    # the same image. CodSpeed's runner (5.4.x) ships valgrind-codspeed
    # packages only for Ubuntu 22.04/24.04 and Debian 12, and elsewhere
    # builds valgrind from source on a "best effort" basis. Move to a newer
    # image in one change of its own once CodSpeed supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # CodSpeedHQ/action authenticates the upload with OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: codspeed
          # Leave ~/.cargo/bin out of the cache. A cached cargo-codspeed,
          # such as the one cargo-binstall installed before the step below
          # was pinned, makes cargo install skip the build from crates.io.
          cache-bin: false

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          # renovate: datasource=crate depName=cargo-codspeed versioning=semver
          tool: cargo-codspeed@5.0.3
          # install-action has no manifest for cargo-codspeed. Build it from
          # crates.io with its lockfile rather than fetch a third-party
          # binary through cargo-binstall. Keep it at the version of the
          # codspeed crates in Cargo.lock, which Renovate updates together
          # with it (the rust-dependencies group).
          fallback: cargo-install

      - name: Build benchmarks
        run: cargo codspeed build -p comprs-bench

      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: cargo codspeed run -p comprs-bench
