name: Renovate

on:
  schedule:
    - cron: '0 19 * * 0' # Weekly Sunday 19:00 UTC (Monday 4:00 JST)
  workflow_dispatch:

# Keep a manual run from racing the scheduled one on the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

# Renovate authenticates with RENOVATE_TOKEN and reads the repository through
# the API, so GITHUB_TOKEN needs no permissions and no checkout is needed.
permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
