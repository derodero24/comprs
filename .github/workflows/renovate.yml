name: Renovate

on:
  schedule:
    - cron: '0 19 * * 0' # Weekly Sunday 19:00 UTC (Monday 4:00 JST)
  workflow_dispatch:

# Keep a manual run from racing the scheduled one on the same branches.
concurrency:
  group: renovate
  cancel-in-progress: false

# Renovate authenticates with RENOVATE_TOKEN and reads the repository through
# the API, so GITHUB_TOKEN needs no permissions and no checkout is needed.
permissions: {}

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: debug
