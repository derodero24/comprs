name: Fuzz

on:
  schedule:
    - cron: '23 3 * * 0' # Weekly, Sunday 03:23 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: choice
        options: ['60', '600', '1800']
        default: '600'
  # Pull requests that change comprs-core or its dependencies check that the
  # fuzz crate still builds. Those that change the fuzz crate also fuzz each
  # target for a minute.
  pull_request:
    paths:
      - 'crates/core-lib/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/fuzz.yml'

permissions: {}

# A newer push to a pull request cancels its running fuzzers. Other runs get
# a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # cargo-fuzz needs a nightly toolchain. A fixed date keeps a broken nightly
  # from failing the runs; move it forward deliberately.
  NIGHTLY: nightly-2026-10-03
  FUZZ_DIR: crates/core-lib/fuzz

jobs:
  changes:
    name: Detect fuzz crate changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      fuzz: ${{ steps.filter.outputs.fuzz }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check whether the fuzz crate changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if grep -qE '^(crates/core-lib/fuzz/|\.github/workflows/fuzz\.yml$)' <<< "$changed"; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "fuzz=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check the fuzz crate
    needs: changes
    # Also when `changes` is skipped, outside pull requests.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check that the fuzzers build the versions that comprs ships
        # Renovate updates Cargo.lock without the fuzz crate's, so only pull
        # requests that change the fuzz crate compare the versions. The
        # weekly run catches the drift that the others leave.
        if: github.event_name != 'pull_request' || needs.changes.outputs.fuzz == 'true'
        run: |
          # Every package that both lockfiles list must have the version of
          # the workspace's Cargo.lock. CONTRIBUTING.md shows how to update
          # the fuzz crate's Cargo.lock from it.
          awk -F '"' '
            /^name = "/ { name = $2 }
            /^version = "/ {
              if (FILENAME == ARGV[1]) {
                shipped[name] = shipped[name] " " $2
              } else if ((name in shipped) && index(shipped[name] " ", " " $2 " ") == 0) {
                printf "::error file=%s::%s %s, but comprs ships%s\n", FILENAME, name, $2, shipped[name]
                stale = 1
              }
            }
            END { exit stale }
          ' Cargo.lock "$FUZZ_DIR/Cargo.lock"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/core-lib/fuzz
      - name: Check formatting
        working-directory: crates/core-lib/fuzz
        run: cargo fmt --check
      # Also fails when comprs-core gains a dependency that the fuzz crate's
      # Cargo.lock does not have yet.
      - name: Lint
        working-directory: crates/core-lib/fuzz
        run: cargo clippy --locked --all-targets -- -D warnings
      # The tests of the panic hook also fail when comprs-core's brotli
      # fallback or the brotli encoder changes in a way that ends the
      # exception the hook makes for the encoder's panics.
      - name: Test
        working-directory: crates/core-lib/fuzz
        run: cargo test --locked

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: changes
    # Not on pull requests that leave the fuzz crate alone: targets that hit
    # bugs whose fixes are still in review would fail them.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.fuzz == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [zstd, gzip, deflate, brotli, lz4, detect, round_trip, unified_decompress]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.NIGHTLY }}
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-fuzz@0.13.2
          # install-action has no manifest for cargo-fuzz. Build it from
          # crates.io with its lockfile rather than fetch a third-party
          # binary through cargo-binstall.
          fallback: cargo-install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates/core-lib/fuzz
      # Each run starts from the corpus of the last scheduled or manual run.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: crates/core-lib/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
        # libFuzzer first runs every input in both directories, so a target
        # also fails when it fails again on the input of a fixed failure in
        # regressions/. It adds the inputs it finds to the first directory.
        # -rss_limit_mb also bounds the zstd C library's allocations, which
        # the targets' own heap checks do not see.
        run: |
          mkdir -p "$FUZZ_DIR/corpus/$TARGET" "$FUZZ_DIR/regressions/$TARGET"
          cargo "+$NIGHTLY" fuzz run --fuzz-dir "$FUZZ_DIR" "$TARGET" \
            "$FUZZ_DIR/corpus/$TARGET" "$FUZZ_DIR/regressions/$TARGET" -- \
            -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048 -timeout=60 \
            -print_final_stats=1
      - name: Save the corpus
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: crates/core-lib/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: crates/core-lib/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
