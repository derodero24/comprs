name: CI

on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - '__test__/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - 'deny.toml'
      - 'vitest.config.mts'
      - 'codecov.yml'
      - 'browser/**'
      - 'streams.js'
      - 'streams.d.ts'
      - 'index.js'
      - 'index.d.ts'
      - 'index.mjs'
      - 'index.d.mts'
      - 'node.js'
      - 'node.d.ts'
      - 'scripts/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'npm/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.nvmrc'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'
  # Pull requests run CI whatever their base branch, so stacked PRs (based on
  # another PR's branch) and PRs into main are checked too.
  pull_request:
    paths:
      - 'crates/**'
      - '__test__/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - 'deny.toml'
      - 'vitest.config.mts'
      - 'codecov.yml'
      - 'browser/**'
      - 'streams.js'
      - 'streams.d.ts'
      - 'index.js'
      - 'index.d.ts'
      - 'index.mjs'
      - 'index.d.mts'
      - 'node.js'
      - 'node.d.ts'
      - 'scripts/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'npm/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.nvmrc'
      - '.github/workflows/build.yml'
      - '.github/workflows/release.yml'

# A newer push to a pull request cancels its running CI. Pushes to develop get
# a group per commit instead: sharing one group would still replace a pending
# run with the next one, so a burst of merges would leave commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      build_targets: ${{ steps.filter.outputs.build_targets }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Decide which build and test matrix to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Pushes to develop always run the full matrix. Pull requests run it
          # only when something that ends up in the native binary or in the
          # release packaging changed; JS-only PRs and most dependency updates
          # build and test on Linux alone.
          native=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(crates/|npm/|scripts/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain|\.github/workflows/(build|ci|release)\.yml$)'; then
              native=false
            fi
            # The napi-rs toolchain (@napi-rs/cli and the @napi-rs packages it
            # uses) builds and packages every binary, so a changed line that
            # names napi in the npm manifest, lockfile or workspace file counts
            # as native too. Other dependency updates in those files stay on
            # Linux; develop runs the full matrix once they are merged. The
            # diff is captured before grep -q reads it: grep -q stops at the
            # first match, and under pipefail the git diff it cut off would
            # turn that match into a miss.
            manifest_diff=$(git diff -U0 "$BASE_SHA" "$HEAD_SHA" -- package.json pnpm-lock.yaml pnpm-workspace.yaml)
            if grep -qE '^[-+].*\bnapi\b' <<< "$manifest_diff"; then
              native=true
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          # build_targets selects the targets of build.yml; empty builds them
          # all. The test matrix loads each binary on its own platform: under
          # Node.js 22 and 24 for x64 Linux, Apple Silicon macOS and x64
          # Windows, and under Node.js 22, the oldest supported version, for
          # the other targets. The musl legs test in an Alpine Linux container
          # (see the test job).
          if [ "$native" = "true" ]; then
            build_targets=''
            test_matrix='{"include":[
              {"node":22,"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
              {"node":24,"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
              {"node":22,"host":"macos-latest","target":"aarch64-apple-darwin"},
              {"node":24,"host":"macos-latest","target":"aarch64-apple-darwin"},
              {"node":22,"host":"windows-latest","target":"x86_64-pc-windows-msvc"},
              {"node":24,"host":"windows-latest","target":"x86_64-pc-windows-msvc"},
              {"node":22,"host":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
              {"node":22,"host":"ubuntu-latest","target":"x86_64-unknown-linux-musl","alpine":true},
              {"node":22,"host":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","alpine":true},
              {"node":22,"host":"macos-26-intel","target":"x86_64-apple-darwin"},
              {"node":22,"host":"windows-11-arm","target":"aarch64-pc-windows-msvc"}
            ]}'
          else
            build_targets='["x86_64-unknown-linux-gnu"]'
            test_matrix='{"include":[
              {"node":22,"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
              {"node":24,"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}
            ]}'
          fi
          echo "build_targets=$build_targets" >> "$GITHUB_OUTPUT"
          echo "test_matrix=$(echo "$test_matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "native=$native"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Verify generated binding files are up to date
        run: git diff --exit-code index.js index.d.ts
      # Type-checks the packed package from strict ES module and CommonJS
      # consumer projects, with TypeScript 7 and 5.9 (#566).
      - name: Consumer type check
        run: pnpm run test:types
      - run: pnpm run typecheck
      - name: Middleware typecheck
        run: pnpm --filter @derodero24/comprs-middleware typecheck
      - run: pnpm run publint
      - name: Validate TypeScript type resolution
        run: pnpm run attw
      - name: Middleware build
        run: pnpm --filter @derodero24/comprs-middleware build
      - name: Middleware publint
        run: pnpm --filter @derodero24/comprs-middleware publint
      # The middleware's attw script skips two checks. node10 resolution does
      # not read exports, so it cannot find the subpaths, and TypeScript 7
      # has removed it. cjs-resolves-to-esm flags require() of an ES module,
      # which Node.js 22.12 and TypeScript 5.8 (module nodenext) accept;
      # packages/middleware/__test__/package.spec.ts checks it instead.
      - name: Validate middleware TypeScript type resolution
        run: pnpm --filter @derodero24/comprs-middleware attw

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit npm dependencies
        run: pnpm audit --prod
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-shear
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-shear
      - name: Detect unused dependencies
        run: cargo shear
      # zlib-rs detects SSE4.2, AVX2, PCLMULQDQ and the aarch64 CRC
      # instructions at run time only with its std feature, which flate2
      # turns on through runtime_detection. Without it zlib-rs falls back to
      # scalar CRC-32 and match finding, and gzip and deflate run up to 3x
      # slower (#509).
      - name: Check that zlib-rs keeps run-time CPU detection
        run: |
          # Captured first, so grep -q exiting early cannot fail cargo tree
          # with SIGPIPE when the shell runs with pipefail.
          tree=$(cargo tree -p comprs -e features -i zlib-rs --locked)
          grep -q 'zlib-rs feature "std"' <<<"$tree" || { echo '::error file=Cargo.toml::flate2 no longer enables zlib-rs/std; gzip and deflate lose SIMD (#509)'; exit 1; }

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -W clippy::all

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test

  # Checks the workspace with the oldest Rust it supports, the rust-version in
  # Cargo.toml; the other jobs use the latest stable. Cargo refuses a
  # dependency that declares a newer rust-version, so an update that raises
  # the minimum fails here until rust-version is raised with it. The
  # WebAssembly crate is checked for wasm32 too, where its dependencies differ.
  # Each cargo call names the toolchain, so the job cannot pass on the stable
  # toolchain that the runner image already has.
  rust-msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        run: |
          version=$(sed -n 's/^rust-version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::No rust-version in [workspace.package]"
            exit 1
          fi
          echo "rust-version: $version"
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.MSRV }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo +"$MSRV" check --workspace --all-targets --locked
      - run: cargo +"$MSRV" check -p comprs-wasm --target wasm32-unknown-unknown --locked

  # Builds the native binaries with build.yml, as release.yml does, so the
  # test jobs load the binaries the release would publish.
  build:
    name: Build
    needs: [changes]
    uses: ./.github/workflows/build.yml
    with:
      # Every target on pushes and native changes; Linux x64 only for
      # JS/lockfile-only pull requests (see the `changes` job).
      targets: ${{ needs.changes.outputs.build_targets }}
      cache: true

  build-wasm-bindgen:
    name: Build - wasm-bindgen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-bindgen
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build wasm-bindgen
        run: pnpm run build:wasm-bindgen
      # The files sit at the root of the artifact; the jobs that download it
      # put them back into browser/.
      - name: Upload wasm-bindgen artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-wasm-bindgen
          path: |
            browser/comprs-wasm.js
            browser/comprs-wasm.d.ts
            browser/comprs-wasm_bg.wasm
          if-no-files-found: error
      # Fails when the binary is over its size budget, after writing the
      # report that the step summary and the PR comment show.
      - name: Check WASM binary size
        run: |
          mkdir -p wasm-size-report
          status=0
          node scripts/wasm-size.mjs --markdown wasm-size-report/report.md || status=$?
          cat wasm-size-report/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Upload WASM size report
        if: ${{ !cancelled() && hashFiles('wasm-size-report/report.md') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-size-report
          path: wasm-size-report/
          if-no-files-found: error

  test:
    name: Test - Node ${{ matrix.node }} / ${{ matrix.target }}
    needs: [changes, build]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Every target on its own platform on pushes and native changes; Linux
      # x64 alone otherwise (see the `changes` job).
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The Alpine Linux legs install the musl builds of the native
      # dependencies, such as Vitest's bundler, for the container below.
      - run: pnpm install --frozen-lockfile ${{ matrix.alpine && '--libc=musl' || '' }}
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-${{ matrix.target }}
          path: .
      - name: Run tests
        if: ${{ !matrix.alpine }}
        run: pnpm test
      # On every Node.js version of the matrix, since engines allows Node.js
      # 22: the package spec checks that require() loads the middleware.
      - name: Middleware tests
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm --filter @derodero24/comprs-middleware test
      - name: ESM import smoke test
        if: ${{ !matrix.alpine }}
        run: node __test__/esm-import.mjs
      # Runs every JS benchmark once, without warmup (BENCH_SMOKE in
      # __test__/bench-fixtures.ts), so a change that breaks the benchmarks
      # fails CI instead of the next `pnpm run bench`.
      - name: Benchmark smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          BENCH_SMOKE: '1'
        run: pnpm run bench --run
      # GitHub runs JavaScript actions in Alpine containers on x64 runners
      # only, so the musl legs set up on the runner and run just the tests in
      # a node:<version>-alpine container. The workspace keeps its path, so
      # the links in node_modules resolve.
      - name: Run tests in Alpine Linux
        if: matrix.alpine
        env:
          IMAGE: node:${{ matrix.node }}-alpine
        run: >-
          docker run --rm --env CI
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$IMAGE"
          sh -c 'node node_modules/vitest/vitest.mjs run && node __test__/esm-import.mjs'

  # The test job skips __test__/wasm.spec.ts, __test__/wasm-parity.spec.ts,
  # __test__/browser-streams.spec.ts and the tests of
  # __test__/browser-entry.spec.ts and __test__/legacy-error-codes.spec.ts
  # that load the browser entry, as it has no wasm-bindgen build. This job
  # runs them, with the native addon for the parity checks.
  test-wasm:
    name: WASM Test (Node.js)
    needs: [build, build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: Download wasm-bindgen artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: browser
      - name: Run WASM tests
        run: pnpm run test:wasm

  # ──── The published entry points, from the packed package ────
  # Assembles the npm packages from this run's Linux and wasm-bindgen
  # artifacts with scripts/prepare-release.mjs, as the Release Dry Run job
  # does, packs them and installs the tarballs into the e2e fixtures
  # (e2e/install-package.mjs). The fixtures import @derodero24/comprs by name,
  # as applications do: Node.js (import and require), Deno and Bun load the
  # native addon, and the browser fixtures (esbuild, webpack, vite build,
  # vite dev and an import map) load the WebAssembly build in Chromium,
  # Firefox and WebKit. The steps after the installation run even when an
  # earlier one fails, so that one failure does not hide the others.
  test-package:
    name: Package E2E
    needs: [build, build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            e2e/pnpm-lock.yaml
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - name: Install the fixtures' dependencies
        run: pnpm --dir e2e install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir e2e exec playwright --version | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell-firefox-webkit
      - name: Install Playwright system dependencies
        run: pnpm --dir e2e exec playwright install-deps chromium firefox webkit
      # Headless Chromium runs the headless shell, so the full browser is not
      # needed.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser install attempt ${attempt}/3"
            # Bound each attempt so a stalled download/extraction is killed and
            # retried, instead of hanging until the step timeout fires.
            if timeout 180 pnpm --dir e2e exec playwright install --only-shell chromium firefox webkit; then
              exit 0
            fi
            echo "Playwright browser install failed or timed out (attempt ${attempt}); retrying..."
            rm -rf ~/.cache/ms-playwright
            sleep 5
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: artifacts/bindings-x86_64-unknown-linux-gnu
      - name: Download wasm-bindgen artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: artifacts/bindings-wasm-bindgen
      - name: Assemble the npm packages
        run: node scripts/prepare-release.mjs --artifacts-dir artifacts --allow-missing-targets
      - name: Install the packed package into the fixtures
        id: install
        run: node e2e/install-package.mjs
      - name: Type-check the fixtures against the packed declarations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec tsc -p e2e && pnpm exec tsc -p e2e/browser
      - name: Node.js
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir e2e run test:node
      - name: Deno
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir e2e run test:deno
      - name: Bun
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir e2e run test:bun
      - name: Build the browser bundles
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir e2e run build
      - name: Browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --dir e2e run test:browser

  # ──── Coverage ────
  # Measures the Rust tests with cargo-llvm-cov and the Vitest tests with V8.
  # The Vitest run fails when the coverage falls below the thresholds in
  # vitest.config.mts. upload-coverage sends both reports to Codecov.
  coverage:
    name: Coverage
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rust coverage
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      # The report covers comprs-core alone. Only the JS tests run the napi
      # and wasm-bindgen bindings, and the benchmarks are not tests, so their
      # lines would count as uncovered and fail Codecov's patch status on
      # every change to them (#659).
      - name: Rust coverage
        run: cargo llvm-cov --lcov --output-path rust-lcov.info --ignore-filename-regex 'crates/(core|wasm|bench)/'

      # JS coverage
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download x86_64 linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      # pnpm passes the options after the script name on to Vitest. Do not
      # put `--` before them: pnpm passes that on too, and Vitest ignores
      # the options after it, so the tests would run without coverage.
      - name: JS coverage
        run: pnpm test --coverage

      # upload-coverage does not fail when Codecov rejects an upload, so
      # check here that both reports were written.
      - name: Check the coverage reports
        run: |
          for report in rust-lcov.info coverage/lcov.info; do
            if ! grep -qs '^SF:' "$report"; then
              echo "::error::$report is missing or covers no source file"
              exit 1
            fi
          done
      - name: Upload the coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            rust-lcov.info
            coverage/lcov.info
          if-no-files-found: error

  # Uploads the reports of the coverage job to Codecov, each on its own with
  # its own flag (see codecov.yml). The uploads authenticate with OIDC, so no
  # secret is needed, and this separate job keeps the ID token away from the
  # dependencies and tests that the coverage job runs. Pull requests from
  # forks get no ID token: codecov-action then uploads without one, which
  # Codecov accepts from forks of public repositories. A Codecov outage must
  # not fail CI, hence fail_ci_if_error: false and no place in CI Complete;
  # the coverage job has already checked the reports.
  upload-coverage:
    name: Upload Coverage
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # codecov-action authenticates the uploads with OIDC
    steps:
      # The Codecov CLI takes the list of the repository's files from the
      # checkout, to map the paths in the reports to them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-reports
          path: .
      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: rust-lcov.info
          disable_search: true
          flags: rust
          name: rust
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload JS coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage/lcov.info
          disable_search: true
          flags: javascript
          name: javascript
          use_oidc: true
          fail_ci_if_error: false

  # Posts the report of build-wasm-bindgen, also when the binary is over its
  # budget, and updates the same comment on later pushes.
  report-wasm-size:
    name: Report WASM Size
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # post the size comment
    steps:
      # Missing when the build failed before the size check.
      - name: Download WASM size report
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-size-report
          path: wasm-size-report
      - name: Add the comment marker
        if: steps.download.outcome == 'success'
        run: |
          { echo '<!-- wasm-size-report -->'; cat wasm-size-report/report.md; } > comment.md
      - name: Find the size comment
        id: find
        if: steps.download.outcome == 'success'
        uses: peter-evans/find-comment@b30e6a3c0ed37e7c023ccd3f1db5c6c0b0c23aad # v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '<!-- wasm-size-report -->'
      - name: Post size comment on PR
        if: steps.download.outcome == 'success'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body-path: comment.md
          edit-mode: replace

  # ──── Release packaging, without publishing ────
  # Assembles the npm packages from this run's artifacts with the script the
  # publish job of release.yml uses (scripts/prepare-release.mjs), then checks
  # them as npm would publish them (scripts/check-release.mjs). The native
  # artifacts come from build.yml, as in release.yml; keep the wasm-bindgen
  # upload in line with that of release.yml.
  release-dry-run:
    name: Release Dry Run
    needs: [changes, build, build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bindings-*
          path: artifacts
      # JS-only pull requests build Linux only (see the `changes` job):
      # --allow-missing-targets limits the platform packages to that one.
      - name: Assemble the npm packages
        run: >-
          node scripts/prepare-release.mjs --artifacts-dir artifacts
          ${{ needs.changes.outputs.native != 'true' && '--allow-missing-targets' || '' }}
      - name: Check the packages
        run: >-
          node scripts/check-release.mjs
          ${{ needs.changes.outputs.native != 'true' && '--allow-missing-targets' || '' }}

  # ──── Aggregate gate: single required status check ────
  # Every job listed here is expected to run, so anything other than success
  # fails the gate. A job is skipped when a job it needs fails (e.g. a build
  # leg skips every test job), so treating "skipped" as a pass would hide it.
  ci-complete:
    name: CI Complete
    if: always()
    needs: [changes, lint, audit, rust-lint, rust-test, rust-msrv, build, build-wasm-bindgen, test, test-wasm, test-package, coverage, release-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$not_ok" ]; then
            echo "::error::Required jobs did not succeed"
            echo "$not_ok"
            exit 1
          fi
          echo "All required jobs succeeded"
