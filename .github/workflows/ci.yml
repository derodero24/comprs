name: CI

on:
  push:
    branches: [develop]
    paths:
      - 'crates/**'
      - '__test__/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - 'deny.toml'
      - 'vitest.config.mts'
      - 'codecov.yml'
      - 'browser/**'
      - 'streams.js'
      - 'streams.d.ts'
      - 'index.js'
      - 'index.d.ts'
      - 'index.mjs'
      - 'index.d.mts'
      - 'node.js'
      - 'node.d.ts'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'npm/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.nvmrc'
      - '.github/workflows/release.yml'
  # Pull requests run CI whatever their base branch, so stacked PRs (based on
  # another PR's branch) and PRs into main are checked too.
  pull_request:
    paths:
      - 'crates/**'
      - '__test__/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig.json'
      - 'biome.json'
      - '.github/workflows/ci.yml'
      - 'deny.toml'
      - 'vitest.config.mts'
      - 'codecov.yml'
      - 'browser/**'
      - 'streams.js'
      - 'streams.d.ts'
      - 'index.js'
      - 'index.d.ts'
      - 'index.mjs'
      - 'index.d.mts'
      - 'node.js'
      - 'node.d.ts'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - 'npm/**'
      - '.cargo/**'
      - 'rust-toolchain*'
      - '.nvmrc'
      - '.github/workflows/release.yml'

# A newer push to a pull request cancels its running CI. Pushes to develop get
# a group per commit instead: sharing one group would still replace a pending
# run with the next one, so a burst of merges would leave commits untested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect native changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      build_settings: ${{ steps.filter.outputs.build_settings }}
      test_matrix: ${{ steps.filter.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Decide which build and test matrix to run
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Pushes to develop always run the full matrix. Pull requests run it
          # only when something that ends up in the native binary or in the
          # release packaging changed; JS-only or lockfile-only PRs build and
          # test on Linux alone.
          native=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -qE '^(crates/|npm/|scripts/|\.cargo/|Cargo\.toml$|Cargo\.lock$|rust-toolchain|\.github/workflows/(ci|release)\.yml$)'; then
              native=false
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          if [ "$native" = "true" ]; then
            build_settings='[
              {"host":"macos-latest","target":"x86_64-apple-darwin"},
              {"host":"macos-latest","target":"aarch64-apple-darwin"},
              {"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
              {"host":"ubuntu-latest","target":"x86_64-unknown-linux-musl"},
              {"host":"ubuntu-latest","target":"aarch64-unknown-linux-gnu"},
              {"host":"ubuntu-latest","target":"aarch64-unknown-linux-musl"},
              {"host":"windows-latest","target":"x86_64-pc-windows-msvc"},
              {"host":"windows-latest","target":"aarch64-pc-windows-msvc"}
            ]'
            test_matrix='{
              "node":[22,24],
              "os":["ubuntu-latest","macos-latest","windows-latest"],
              "include":[
                {"os":"ubuntu-latest","artifact":"bindings-x86_64-unknown-linux-gnu"},
                {"os":"macos-latest","artifact":"bindings-aarch64-apple-darwin"},
                {"os":"windows-latest","artifact":"bindings-x86_64-pc-windows-msvc"}
              ]
            }'
          else
            build_settings='[
              {"host":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}
            ]'
            test_matrix='{
              "node":[22,24],
              "os":["ubuntu-latest"],
              "include":[
                {"os":"ubuntu-latest","artifact":"bindings-x86_64-unknown-linux-gnu"}
              ]
            }'
          fi
          echo "build_settings=$(echo "$build_settings" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "test_matrix=$(echo "$test_matrix" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "native=$native"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
      - name: Verify generated binding files are up to date
        run: git diff --exit-code index.js index.d.ts
      - run: pnpm run typecheck
      - name: Middleware typecheck
        run: pnpm --filter @derodero24/comprs-middleware typecheck
      - run: pnpm run publint
      - name: Validate TypeScript type resolution
        run: pnpm run attw

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit npm dependencies
        run: pnpm audit --prod
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit
      - name: Install cargo-shear
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-shear
      - name: Detect unused dependencies
        run: cargo shear

  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -W clippy::all

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: [changes]
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Full target list on pushes and native changes; Linux only for
        # JS/lockfile-only pull requests (see the `changes` job).
        settings: ${{ fromJSON(needs.changes.outputs.build_settings) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: build-${{ matrix.settings.target }}
      - run: pnpm install --frozen-lockfile

      # Linux cross-compilation setup
      - name: Install cross-compilation tools (aarch64-gnu)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools (x86_64-musl)
        if: matrix.settings.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools (aarch64-musl)
        if: matrix.settings.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build native
        run: pnpm run build --target ${{ matrix.settings.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.node
            index.js
            index.d.ts
          if-no-files-found: ignore

  build-wasm-bindgen:
    name: Build - wasm-bindgen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: wasm-bindgen
      - run: pnpm install --frozen-lockfile
      - name: Install wasm-pack
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none
      - name: Build wasm-bindgen
        run: pnpm run build:wasm-bindgen
      - name: Report WASM binary size
        run: |
          WASM_FILE=browser/comprs-wasm_bg.wasm
          SIZE_KB=$(( $(stat -c%s "$WASM_FILE") / 1024 ))
          {
            echo "### WASM Binary Size"
            echo ""
            echo "| File | Size |"
            echo "|------|------|"
            echo "| $WASM_FILE | ${SIZE_KB} KB |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p wasm-size-report
          echo "$WASM_FILE" > wasm-size-report/file.txt
          echo "$SIZE_KB" > wasm-size-report/size.txt
      - name: Upload WASM size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-size-report
          path: wasm-size-report/
          if-no-files-found: error
      # The files sit at the root of the artifact; the jobs that download it
      # put them back into browser/.
      - name: Upload wasm-bindgen artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-wasm-bindgen
          path: |
            browser/comprs-wasm.js
            browser/comprs-wasm.d.ts
            browser/comprs-wasm_bg.wasm
          if-no-files-found: error

  test:
    name: Test - Node ${{ matrix.node }} / ${{ matrix.os }}
    needs: [changes, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 3 OS x 2 Node on pushes and native changes; Ubuntu x 2 Node otherwise
      # (see the `changes` job).
      matrix: ${{ fromJSON(needs.changes.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.artifact }}
          path: .
      - run: pnpm test
      - name: Middleware tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm --filter @derodero24/comprs-middleware test
      - name: ESM import smoke test
        run: node __test__/esm-import.mjs

  # The test job skips __test__/wasm.spec.ts, __test__/wasm-parity.spec.ts,
  # __test__/browser-streams.spec.ts and the tests of
  # __test__/browser-entry.spec.ts that load the browser entry, as it has no
  # wasm-bindgen build. This job runs them, with the native addon for the
  # parity checks.
  test-wasm:
    name: WASM Test (Node.js)
    needs: [build, build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: Download wasm-bindgen artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: browser
      - name: Run WASM tests
        run: pnpm run test:wasm

  test-browser:
    name: Browser WASM Test
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download wasm-bindgen artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-wasm-bindgen
          path: browser
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            echo "Playwright browser install attempt ${attempt}/3"
            # Bound each attempt so a stalled download/extraction is killed and
            # retried, instead of hanging until the step timeout fires.
            if timeout 180 pnpm exec playwright install chromium; then
              exit 0
            fi
            echo "Playwright browser install failed or timed out (attempt ${attempt}); retrying..."
            rm -rf ~/.cache/ms-playwright
            sleep 5
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1
      - name: Run browser tests
        run: pnpm run test:browser

  # Deno and Bun import @derodero24/comprs by name, as an application does:
  # they resolve its `import` entry, which loads the native addon.
  test-deno:
    name: Deno Test
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: Run Deno tests
        run: pnpm run test:deno

  test-bun:
    name: Bun Test
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: pnpm install --frozen-lockfile
      - name: Download native artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: Run Bun tests
        run: pnpm run test:bun

  coverage:
    name: Coverage
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Rust coverage
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      - name: Rust coverage
        run: cargo llvm-cov --lcov --output-path rust-lcov.info

      # JS coverage
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download x86_64 linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .
      - name: JS coverage
        run: pnpm test -- --coverage

      # Upload to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: rust-lcov.info,coverage/lcov.info
          flags: rust,javascript
          fail_ci_if_error: false

  report-wasm-size:
    name: Report WASM Size
    if: github.event_name == 'pull_request'
    needs: [build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write # post the size comment
    steps:
      - name: Download WASM size report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-size-report
          path: wasm-size-report
      - name: Read size data
        id: read
        run: |
          echo "file=$(cat wasm-size-report/file.txt)" >> $GITHUB_OUTPUT
          echo "size=$(cat wasm-size-report/size.txt)" >> $GITHUB_OUTPUT
      - name: Post size comment on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### WASM Binary Size

            | File | Size |
            |------|------|
            | ${{ steps.read.outputs.file }} | ${{ steps.read.outputs.size }} KB |
          comment-tag: wasm-size-report

  # ──── Release packaging, without publishing ────
  # Assembles the npm packages from this run's artifacts with the script the
  # publish job of release.yml uses (scripts/prepare-release.mjs), then checks
  # them as npm would publish them (scripts/check-release.mjs). The artifacts
  # come from this workflow's build jobs, so keep their uploads in line with
  # those of release.yml.
  release-dry-run:
    name: Release Dry Run
    needs: [changes, build, build-wasm-bindgen]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bindings-*
          path: artifacts
      # JS-only pull requests build Linux only (see the `changes` job):
      # --allow-missing-targets limits the platform packages to that one.
      - name: Assemble the npm packages
        run: >-
          node scripts/prepare-release.mjs --artifacts-dir artifacts
          ${{ needs.changes.outputs.native != 'true' && '--allow-missing-targets' || '' }}
      - name: Check the packages
        run: >-
          node scripts/check-release.mjs
          ${{ needs.changes.outputs.native != 'true' && '--allow-missing-targets' || '' }}

  # ──── Aggregate gate: single required status check ────
  # Every job listed here is expected to run, so anything other than success
  # fails the gate. A job is skipped when a job it needs fails (e.g. a build
  # leg skips every test job), so treating "skipped" as a pass would hide it.
  ci-complete:
    name: CI Complete
    if: always()
    needs: [changes, lint, audit, rust-lint, rust-test, build, build-wasm-bindgen, test, test-wasm, test-browser, test-deno, test-bun, coverage, release-dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "$NEEDS")
          if [ -n "$not_ok" ]; then
            echo "::error::Required jobs did not succeed"
            echo "$not_ok"
            exit 1
          fi
          echo "All required jobs succeeded"
