name: Deploy Playground

on:
  push:
    branches: [develop]
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'browser-entry.js'
      - 'browser-streaming.js'
      - 'browser.js'
      - 'scripts/build-wasm-bindgen.js'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy playground
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: playground-wasm-bindgen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build wasm-bindgen WASM
        run: pnpm run build:wasm-bindgen

      - name: Install playground dependencies
        run: cd playground && pnpm install

      - name: Build playground
        run: cd playground && pnpm build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

      - uses: actions/deploy-pages@v5
        id: deployment
