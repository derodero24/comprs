name: Deploy Playground

on:
  push:
    branches: [develop]
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
      - 'crates/**'
      - 'package.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'browser/**'
      - 'scripts/build-wasm-bindgen.js'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Installs and builds run without any write permission; only the deploy job
  # below can publish to Pages, and it runs no repository code.
  build:
    name: Build playground
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: playground-wasm-bindgen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build wasm-bindgen WASM
        run: pnpm run build:wasm-bindgen

      # After the WebAssembly build: the file:.. dependency installs the
      # package with the files that exist at install time, and the playground
      # build fails if the binary is missing.
      - name: Install playground dependencies
        run: cd playground && pnpm install --frozen-lockfile

      - name: Build playground
        run: cd playground && pnpm build
        env:
          GITHUB_ACTIONS: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground/dist

  deploy:
    name: Deploy playground
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages verifies the deployment's origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
