name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
      # The API reference comes from the declaration files.
      - '*.d.ts'
      - '*.d.mts'
      - 'next/*.d.ts'
      - 'crates/**'
      - 'package.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'browser/**'
      - 'scripts/build-wasm-bindgen.js'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Installs and builds run without any write permission; only the deploy job
  # below can publish to Pages, and it runs no repository code.
  build:
    name: Build website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: website-wasm-bindgen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install wasm-pack
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          # renovate: datasource=crate depName=wasm-pack versioning=semver
          tool: wasm-pack@0.15.0
          fallback: none

      - name: Build wasm-bindgen WASM
        run: pnpm run build:wasm-bindgen

      # After the WebAssembly build: the file:.. dependency installs the
      # package with the files that exist at install time, and the build of
      # the playground page fails if the binary is missing.
      - name: Install website dependencies
        run: pnpm --dir website install --frozen-lockfile

      # astro build does not type-check the site, and a push that changes
      # only the website runs no CI.
      - name: Check website
        run: pnpm --dir website run check

      - name: Build website
        run: pnpm --dir website run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy website
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the site
      id-token: write # deploy-pages verifies the deployment's origin with OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
