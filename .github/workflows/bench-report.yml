name: Bench Report

# Regenerates the benchmark tables of the website and the charts with
# scripts/bench-report.mjs, on a GitHub-hosted runner, and pushes them to a new
# branch, bench-report/<run id>-<run attempt>, for a maintainer to open a pull
# request from (see "Regenerating the benchmarks" in CONTRIBUTING.md).
# A re-run of the workflow keeps the run id, so the attempt gives it a branch
# of its own instead of a rejected push to the first attempt's. No job both
# runs the repository's code and holds a token that can write: the bench job
# runs the benchmarks with a read-only token, and the publish-branch job,
# which can push, runs no code from the repository, only git on the files
# that the bench job uploaded. It never pushes to main.
on:
  workflow_dispatch:

permissions: {}

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      # The release build, which npm publishes.
      - run: pnpm run build
      - name: Run the benchmarks and render the report
        run: node scripts/bench-report.mjs --raw-dir "$RUNNER_TEMP/bench-report/raw"
      # upload-artifact leaves out hidden directories such as .github, so the
      # files go into the artifact under their names alone.
      - name: Collect the report
        run: |
          cp website/src/bench/report.md .github/assets/bench-compress.svg \
            .github/assets/bench-cross-algorithm.svg "$RUNNER_TEMP/bench-report/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-report
          path: ${{ runner.temp }}/bench-report
          if-no-files-found: error

  publish-branch:
    name: Publish branch
    needs: bench
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the bench-report/<run id>-<run attempt> branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-report
          path: ${{ runner.temp }}/bench-report
      - name: Commit the report
        run: |
          cp "$RUNNER_TEMP/bench-report/report.md" website/src/bench/report.md
          cp "$RUNNER_TEMP/bench-report/bench-compress.svg" \
            "$RUNNER_TEMP/bench-report/bench-cross-algorithm.svg" .github/assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/src/bench/report.md .github/assets/bench-compress.svg \
            .github/assets/bench-cross-algorithm.svg
          git commit -m "docs(bench): regenerate the benchmark tables"
      # The token reaches git as an HTTP header for this one push, as
      # actions/checkout would pass it, and is not stored in .git/config.
      - name: Push the branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="bench-report/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin "HEAD:refs/heads/${branch}"
          {
            echo "Pushed the report to \`${branch}\`."
            echo
            echo "[Open a pull request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${branch}?expand=1) into \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"
