name: Bug Report
description: Report a bug or unexpected behavior
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Install `@derodero24/comprs`
        2. Call `zstdCompress(...)` or `decompress(...)`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@derodero24/comprs'
        - '@derodero24/comprs-middleware'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: The version that `npm ls` prints for the package chosen above. For the middleware, also give the version of `@derodero24/comprs`.
      placeholder: e.g. 2.0.2
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Node.js
        - Browser (WASM)
        - Deno
        - Bun
        - Other
    validations:
      required: true
  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: e.g. Node.js 22.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any additional environment details (OS, architecture, bundler, etc.). If the middleware is affected, also the framework and its version (Express, Fastify or Hono).
