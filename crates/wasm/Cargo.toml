[package]
name = "comprs-wasm"
version = "2.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The default build has every format and both APIs, for the browser entry and
# for ./next. Each per-format build of the unified API (#342) enables one of
# zstd, gzip, brotli and lz4 alone, without default features: it has only the
# unified API (src/next.rs), for its formats.
[features]
default = ["classic"]
# The classic API (src/classic.rs), which needs every format.
classic = ["zstd", "gzip", "brotli", "lz4"]
zstd = ["comprs-core/zstd"]
gzip = ["comprs-core/gzip"]
brotli = ["comprs-core/brotli"]
lz4 = ["comprs-core/lz4"]

[dependencies]
comprs-core = { path = "../core-lib", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-opt makes the gzip and brotli downloads larger (see the wasm-release
# profile in the workspace Cargo.toml). scripts/build-wasm-bindgen.js builds
# with that profile, which wasm-pack configures as `custom`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
wasm-opt = false

# Getter::call_tag in src/lib.rs needs the release glue of wasm-bindgen,
# which reads the string that it returns as `Some(true)`: the debug glue
# (`debug-js-glue = true`, the default of `wasm-pack build --dev`) throws for
# a value that is not a boolean. The custom profile defaults to the release
# glue; this keeps it.
[package.metadata.wasm-pack.profile.custom.wasm-bindgen]
debug-js-glue = false
