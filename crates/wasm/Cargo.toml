[package]
name = "comprs-wasm"
version = "2.0.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
comprs-core = { path = "../core-lib" }
wasm-bindgen = "0.2"
js-sys = "0.3"

# wasm-opt makes the gzip and brotli downloads larger (see the wasm-release
# profile in the workspace Cargo.toml). scripts/build-wasm-bindgen.js builds
# with that profile, which wasm-pack configures as `custom`.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
