[package]
name = "comprs-bench"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
criterion = { version = "5.0.0", package = "codspeed-criterion-compat" }
# With the features of the native addon, so the benchmarks measure the code
# that comprs ships.
comprs-core = { path = "../core-lib", features = ["zstdmt"] }
# The codec crates alone, for the baseline benchmarks marked "(upstream)".
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
lz4_flex = { workspace = true }

[[bench]]
name = "gzip"
harness = false

[[bench]]
name = "deflate"
harness = false

[[bench]]
name = "brotli"
harness = false

[[bench]]
name = "zstd"
harness = false

[[bench]]
name = "lz4"
harness = false
