[advisories]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
# thiserror-impl and wasm-bindgen moved to syn 3 while napi-derive, serde_derive
# and futures-macro still use syn 2. Both are proc-macro-only crates, so the
# duplicate does not reach the published binary. Drop once the rest catch up.
skip = [{ name = "syn", version = "2" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
