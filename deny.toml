[advisories]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
# serde_derive, futures-macro, thiserror-impl and wasm-bindgen moved to syn 3
# while napi-derive, napi-derive-backend and zerocopy-derive still use syn 2.
# Both are proc-macro-only crates, so the duplicate does not reach the
# published binary. Drop once the rest catch up.
skip = [{ name = "syn", version = "2" }]
# web-sys pins js-sys and wasm-bindgen to exact versions, so with web-sys in
# Cargo.lock Renovate cannot update the wasm-bindgen and js-sys of
# crates/wasm (#640). It came in through criterion's `plotters` feature,
# which crates/bench turns off.
deny = [
  { crate = "web-sys", reason = "its exact js-sys and wasm-bindgen pins block their updates (#640)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
